services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: fcs-app-postgres
    environment:
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_DB=postgres'
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: fsc-kafka
    ports:
      - '9092:9092'   # доступ с хоста (для запуска из IDE)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Два listener'а: PLAINTEXT — для общения внутри Docker, EXTERNAL — для хоста
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - app-network

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: fcs-seaweedfs
    ports:
      - '9000:9000'
      - '9001:9333'
    command: server -s3 -s3.port=9000 -master.volumeSizeLimitMB=100
    environment:
      S3_ACCESS_KEY: seaweedfsadmin
      S3_SECRET_KEY: seaweedfsadmin
    volumes:
      - seaweedfs-data:/data
      - ./security.toml:/etc/seaweedfs/security.toml:ro   # монтируем ключ
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "-I", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: DockerfileMultiStages
    container_name: fcs-app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    environment:
      POSTGRES_HOST: fcs-app-postgres   # имя контейнера с БД
      POSTGRES_PORT: 5432               # ВНУТРЕННИЙ порт Postgres(не 5433!)
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      # Kafka — внутри Docker-сети используем внутренний listener
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # SeaweedFS — внутри Docker-сети используем имя контейнера
      SEAWEEDFS_URL: http://seaweedfs:9000
      SEAWEEDFS_ACCESS_KEY: seaweedfsadmin
      SEAWEEDFS_SECRET_KEY: seaweedfsadmin
      SEAWEEDFS_BUCKET: files
    networks:
      - app-network

volumes:
  seaweedfs-data:
  postgres-data:

networks:
  app-network:
    driver: bridge