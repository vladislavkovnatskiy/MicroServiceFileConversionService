app:
  postgres:
    host: ${POSTGRES_HOST:localhost}
    port: ${POSTGRES_PORT:5433}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    database: ${POSTGRES_DATABASE:postgres}

  seaweedfs:
    url:  ${SEAWEEDFS_URL:http://localhost:9000}
    access-key: ${SEAWEEDFS_ACCESS_KEY:seaweedfsadmin}
    secret-key: ${SEAWEEDFS_SECRET_KEY:seaweedfsadmin}
    bucket: ${SEAWEEDFS_BUCKET:files}

  kafka:
    request-topic: file-conversion-request
    result-topic: file-conversion-result
spring:
  application:
    name: FileConversionService
  kafka:
    logging:
      level:
        org.springframework.kafka: DEBUG
        org.springframework.kafka.annotation: TRACE
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: file-conversion-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            key:
              delegate:
                class: org.apache.kafka.common.serialization.StringDeserializer
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JsonDeserializer
          json:
            trusted:
              packages: "com.example.fileconversionservice.dto"
            value:
              default.type: "com.example.fileconversionservice.dto.FileConversionRequestDto"
            use.type.headers: false
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  main:
    web-application-type: none
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
  datasource:
    url: jdbc:postgresql://${app.postgres.host}:${app.postgres.port}/${app.postgres.database}
    username: ${app.postgres.username}
    password: ${app.postgres.password}
    driver-class-name: org.postgresql.Driver